controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    # Joint state controller
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Effort controllers for wheels
    left_wheel_controller:
      type: effort_controllers/JointPositionController
      joints:
        - left_rim_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity

    right_wheel_controller:
      type: effort_controllers/JointPositionController
      joints:
        - right_rim_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity

    back_wheel_controller:
      type: effort_controllers/JointPositionController
      joints:
        - back_rim_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity

# Hardware interface configuration
hardware_interface:
  ros__parameters:
    joints:
      - left_rim_joint
      - right_rim_joint
      - back_rim_joint

