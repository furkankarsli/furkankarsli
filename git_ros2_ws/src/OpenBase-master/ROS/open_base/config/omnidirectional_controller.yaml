controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true

    # Joint state broadcaster
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Omnidirectional controller for 3 wheels
    omnidirectional_controller:
      type: omnidirectional_controllers/OmnidirectionalController

# Omnidirectional robot specific parameters
omnidirectional_controller:
  ros__parameters:
    # Wheel names (must match URDF joint names)
    wheel_names: 
      - left_rim_joint
      - right_rim_joint
      - back_rim_joint

    # Robot parameters (calculated from URDF)
    robot_radius: 0.04  # Distance from center to back wheel (0.04m)
    wheel_radius: 0.01355  # Wheel radius from URDF roller position
    gamma: 0.0  # Back wheel is at 180° (negative Y axis)
    
    # Wheel positions (calculated from URDF coordinates)
    wheel_positions:
      left_rim_joint: [0.03464101615, 0.02, 0]    # Left wheel at ~60°
      right_rim_joint: [-0.03464101615, 0.02, 0]   # Right wheel at ~-60°
      back_rim_joint: [0, -0.04, 0]                # Back wheel at 180°

    # Publishing parameters
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    odom_numeric_integration_method: runge_kutta2

    # Control parameters
    open_loop: false  # Use wheel feedback for odometry
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
